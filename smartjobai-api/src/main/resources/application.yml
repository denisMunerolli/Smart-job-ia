server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: smartjobai
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    expirationMs: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  server-url: ${SERVER_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Adzuna - obtenha em https://developer.adzuna.com/signup
adzuna:
  app-id: ${ADZUNA_APP_ID:}
  app-key: ${ADZUNA_APP_KEY:}
  country: ${ADZUNA_COUNTRY:br}

# RSS feed de vagas
rss:
  vagas:
    url: ${RSS_VAGAS_URL:}

# Termos para importação automática
import:
  termos: ${IMPORT_TERMOS:Java,Python,React,Spring Boot,Node.js}
  localizacao: ${IMPORT_LOCALIZACAO:Brasil}

# Anthropic Claude AI - obtenha em https://console.anthropic.com
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
