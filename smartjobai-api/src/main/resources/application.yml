server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: smartjobai
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    expirationMs: 86400000

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,https://smartjobai-api-production.up.railway.app}

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  server-url: ${SERVER_URL:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info

# ── Integrações de vagas ──────────────────────────────────────────────────────
# Adzuna: obtenha credenciais em https://developer.adzuna.com/signup (gratuito)
# Defina no Railway: ADZUNA_APP_ID e ADZUNA_APP_KEY
adzuna:
  app-id: ${ADZUNA_APP_ID:}
  app-key: ${ADZUNA_APP_KEY:}
  country: ${ADZUNA_COUNTRY:br}

# RSS: qualquer feed público de vagas (Programathor, etc.)
# Defina no Railway: RSS_VAGAS_URL
rss:
  vagas:
    url: ${RSS_VAGAS_URL:}

# Termos e localização para o job de importação
import:
  termos: ${IMPORT_TERMOS:Java,Python,React,Spring Boot,Node.js}
  localizacao: ${IMPORT_LOCALIZACAO:Brasil}
