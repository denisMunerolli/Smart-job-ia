name: Continuous Integration (Cloud Build & Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smartjobai_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Java Unit & Integration Tests
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartjobai_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgrespassword
      run: |
        mvn clean verify -B 2>&1 | tee /tmp/maven-output.txt
        EXIT_CODE=${PIPESTATUS[0]}
        # Extrai apenas linhas de erro para um arquivo menor
        grep -E "ERROR|FAILED|error:|cannot find|does not|Tests run|BUILD" /tmp/maven-output.txt > /tmp/maven-errors.txt || true
        exit $EXIT_CODE

    - name: Upload Maven error log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: maven-errors
        path: /tmp/maven-errors.txt
        retention-days: 1

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Python Tools Tests
      run: |
        if [ -d "tools/tailor" ]; then
          cd tools/tailor
          python -m unittest discover -s . -p "test_*.py"
        fi
