name: Continuous Integration (Cloud Build & Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smartjobai_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Java Unit & Integration Tests
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartjobai_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgrespassword
      run: |
        set -o pipefail
        mvn clean verify -B 2>&1 | tee /tmp/maven-output.txt; MVN_EXIT=${PIPESTATUS[0]}
        if [ $MVN_EXIT -ne 0 ]; then
          echo "::group::Maven Errors"
          grep -E "\[ERROR\]|\[WARN\].*error|Tests run.*FAILURE|BUILD FAILURE|cannot find symbol|package.*does not exist|incompatible" /tmp/maven-output.txt | head -80 || true
          echo "::endgroup::"
          # Publica o erro como annotation visível na API
          ERROR_MSG=$(grep -E "\[ERROR\]" /tmp/maven-output.txt | grep -v "^\[ERROR\] $" | head -30 | tr '\n' '|')
          echo "MAVEN_ERRORS=${ERROR_MSG}" >> $GITHUB_ENV
        fi
        exit $MVN_EXIT

    - name: Print errors as step summary
      if: failure()
      run: |
        echo "## Build Errors" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        grep -E "\[ERROR\]|Tests run.*FAILURE|BUILD FAILURE|cannot find symbol|package.*does not exist" /tmp/maven-output.txt | head -60 >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Python Tools Tests
      run: |
        if [ -d "tools/tailor" ]; then
          cd tools/tailor
          python -m unittest discover -s . -p "test_*.py"
        fi
