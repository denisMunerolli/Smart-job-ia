name: Continuous Integration (Cloud Build & Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smartjobai_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and run unit tests
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartjobai_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgrespassword
      run: |
        set -o pipefail
        mvn clean verify -B \
          -Dexclude="**/UsuarioServiceTest.java,**/FormacaoServiceTest.java" \
          2>&1 | tee /tmp/maven-output.txt; MVN_EXIT=${PIPESTATUS[0]}
        exit $MVN_EXIT

    - name: Commit error log to repository
      if: failure()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        grep -E "\[ERROR\]|Tests run.*FAILURE|BUILD FAILURE|cannot find symbol|package.*does not exist" \
          /tmp/maven-output.txt | head -100 > docs/ci-build-errors.txt || true
        echo "--- Full output tail ---" >> docs/ci-build-errors.txt
        tail -50 /tmp/maven-output.txt >> docs/ci-build-errors.txt
        git add docs/ci-build-errors.txt
        git diff --staged --quiet || git commit -m "ci: atualiza log de erros do build [skip ci]"
        git push

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Python Tools Tests
      run: |
        if [ -d "tools/tailor" ]; then
          cd tools/tailor
          python -m unittest discover -s . -p "test_*.py"
        fi
