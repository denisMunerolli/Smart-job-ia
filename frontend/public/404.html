<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SmartJobAI</title>
  <script>
    // Redireciona para index.html mantendo o path para React Router
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 2).join('/') +
      '/?p=' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g,'~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g,'~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
